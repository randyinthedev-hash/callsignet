# 태그를 밀면 릴리스를 만들고 csa를 붙인다.
#
# 붙이는 것은 정적으로 링크한 리눅스 바이너리다. Rocky는 Ubuntu보다 glibc가
# 낮아 동적으로 링크한 것이 돌지 않는다.
name: 릴리스

on:
  push:
    tags: ["v*"]

# 권한은 릴리스를 만드는 작업에만 준다. 시험을 돌리는 작업은 읽기만 하면 된다.
permissions:
  contents: read

jobs:
  # 태그가 시험을 지난 커밋을 가리킨다는 보장은 태그 자체에 없다. 그래서
  # 바이너리를 만들기 전에 여기서 다시 돌린다.
  verify:
    name: 시험을 다시 돌린다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make test
      # 시험 워크플로와 같은 검사를 여기서도 돌린다. 태그를 미는 길로만 오면
      # 취약점 검사를 건너뛰는 자리가 있어서는 안 된다.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: 준비물을 설치한다
        run: sudo apt-get update -qq && sudo apt-get install -yqq nftables dnsutils
      - name: 브리지로 오가는 패킷을 막지 않게 한다
        run: |
          sudo modprobe br_netfilter || true
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0 || true
          sudo iptables -P FORWARD ACCEPT || true
      - name: 통합 시험을 돌린다
        run: sudo make tunnel

  release:
    name: 릴리스를 만든다
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # 태그와 csa가 찍는 판이 다르면 쓰는 쪽이 어느 것을 받았는지 알 수 없다.
      - name: 태그와 csa의 판이 같은지 본다
        run: |
          tag="${GITHUB_REF_NAME#v}"
          got="$(go run ./cmd/csa version)"
          if [ "$tag" != "$got" ]; then
            echo "태그와 csa의 판이 다릅니다. 태그 $tag, csa $got" >&2
            exit 1
          fi

      # -w는 디버그 정보를 지운다. -s는 쓰지 않는다. -s가 심볼 표를 지우면
      # govulncheck가 바이너리에서 어느 함수를 부르는지 보지 못한다. 그때
      # govulncheck는 모듈 단위로만 보아, csa가 부르지도 않는 취약점을 알린다.
      # 받는 사람이 붙인 바이너리를 스스로 재는 길을 막지 않는다.
      - name: csa를 만든다
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-w" -o "csa-linux-$arch" ./cmd/csa
          done

      # 소스를 잰 것과 붙이는 것이 같다는 보장은 없다. 붙일 바이너리를 그대로 잰다.
      - name: 붙일 바이너리를 잰다
        run: |
          for arch in amd64 arm64; do
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary "./csa-linux-$arch"
          done

      # 실행 파일 하나만 내려받아도 서비스 파일과 설치 절차와 라이선스가 함께
      # 오게 묶는다. make dist와 같은 스크립트로 묶으므로 소스에서 만든 것과
      # 모양이 같다. 체크섬은 받는 쪽이 실제로 내려받는 묶음에 대해 만든다.
      - name: 설치 묶음을 만든다
        run: |
          for arch in amd64 arm64; do
            dist/pack.sh "csa-linux-$arch" "$arch" dist/out
          done
          cd dist/out && sha256sum *.tar.gz > sha256sum.txt && cat sha256sum.txt

      - name: 릴리스를 만든다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "무엇을 만들었는지는 [릴리스 노트](RELEASE_NOTES.md)에 있습니다. 묶음마다 정적으로 링크한 리눅스 바이너리와 systemd 서비스 파일과 설치 스크립트와 라이선스가 함께 들어 있습니다. 설치하는 방법은 묶음 안의 INSTALL.md에 있습니다." \
            dist/out/*.tar.gz dist/out/sha256sum.txt LICENSE THIRD-PARTY-NOTICES.md
