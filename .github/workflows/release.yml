# 태그를 밀면 릴리스를 만들고 csa의 묶음과 출처 증명과 부품 목록을 붙인다.
#
# 붙이는 것은 정적으로 링크한 리눅스 바이너리를 담은 묶음이다. Rocky는 Ubuntu보다
# glibc가 낮아 동적으로 링크한 것이 돌지 않는다.
#
# 순서는 설계 문서의 「발행」 절대로다. 실행 파일을 만들고 buildinfo를 검사하고,
# SBOM을 만들어 독립 검사를 하고, 묶음을 만들고, 그 묶음을 대상으로 출처 증명과
# SBOM 증명을 만들고, 둘을 JSONL로 조립하고, 온라인과 오프라인으로 검증한 뒤에야
# 릴리스를 만든다. 어디서든 실패하면 릴리스는 만들어지지 않고 태그는 남는다.
#
# workflow_dispatch로 돌리면 예행 실행이다. 릴리스를 만드는 걸음만 빼고 모두
# 밟는다. 발행할 파일을 다시 검증하는 길도 예행에서 밟는다. 예행 실행의 증명은
# refs/heads/main으로 서명되어 태그를 강제하는 검증에 걸리지 않으므로 발행본과
# 섞이지 않는다. 다만 그 증명도 GitHub의 증명 저장소에 영구히 남는다.
name: 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 권한은 작업마다 따로 준다. 시험을 돌리는 작업은 읽기만 하면 된다.
permissions:
  contents: read

env:
  # gh는 2.97.0 이상이어야 한다. 그 앞 판에는 --signer-workflow 검증을 우회하는
  # 결함(GHSA-mm27-mwq9-fr5g)이 있다. 러너에 미리 깔린 gh는 판이 움직이므로
  # 정확한 판과 체크섬으로 따로 설치한다.
  GH_VERSION: 2.100.0
  GH_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
  REPO: ${{ github.repository }}

jobs:
  # 태그가 시험을 지난 커밋을 가리킨다는 보장은 태그 자체에 없다. 그래서
  # 바이너리를 만들기 전에 여기서 다시 돌린다.
  verify:
    name: 시험을 다시 돌린다
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make test
      # 시험 워크플로와 같은 검사를 여기서도 돌린다. 태그를 미는 길로만 오면
      # 취약점 검사를 건너뛰는 자리가 있어서는 안 된다.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: 준비물을 설치한다
        run: sudo apt-get update -qq && sudo apt-get install -yqq nftables
      - name: 브리지로 오가는 패킷을 막지 않게 한다
        run: |
          sudo modprobe br_netfilter || true
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0 || true
          sudo iptables -P FORWARD ACCEPT || true
      - name: 통합 시험을 돌린다
        run: sudo make tunnel

  # 아키텍처마다 묶음 하나를 만들고 증명한다. 증명을 만드는 작업에만 그 권한을 준다.
  build:
    name: 묶음을 만들고 증명한다 (${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    # 릴리스를 만드는 작업이 같은 판과 참조로 다시 검증한다. 행렬의 두 작업이 같은 값을 쓴다.
    outputs:
      version: ${{ steps.ref.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # 작업 나무 밖에서 한다. 작업 나무에 파일이 하나라도 더 생기면 go가
      # buildinfo에 vcs.modified를 참으로 찍고 뒤의 검사가 걸린다.
      - name: gh를 정확한 판으로 설치한다
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gh.tar.gz "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  gh.tar.gz" | sha256sum -c --quiet
          tar -xzf gh.tar.gz
          mkdir -p "$HOME/.local/bin" && mv "gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version

      # 태그와 csa가 찍는 판이 다르면 쓰는 쪽이 어느 것을 받았는지 알 수 없다.
      # 예행 실행에는 태그가 없으므로 소스의 판을 그대로 쓴다.
      - name: 판과 참조를 정한다
        id: ref
        run: |
          got="$(go run ./cmd/csa version)"
          if [ "${{ github.event_name }}" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$got" ]; then
              echo "태그와 csa의 판이 다릅니다. 태그 $tag, csa $got" >&2
              exit 1
            fi
          fi
          echo "version=$got" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"

      # -w는 디버그 정보를 지운다. -s는 쓰지 않는다. -s가 심볼 표를 지우면
      # govulncheck가 바이너리에서 어느 함수를 부르는지 보지 못한다. 받는 사람이
      # 붙인 바이너리를 스스로 재는 길을 막지 않는다. 작업 나무를 고치지 않으므로
      # buildinfo에 vcs.revision이 이 커밋으로, vcs.modified가 false로 찍힌다.
      # 만드는 자리 dist/out은 .gitignore에 있다. 추적하지 않는 파일도 go에는
      # 고친 것으로 보이므로, 작업 나무 안에는 무시되는 자리에만 쓴다.
      - name: 작업 나무가 깨끗한지 본다
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "작업 나무가 깨끗하지 않습니다. buildinfo에 vcs.modified가 참으로 찍힙니다." >&2
            git status --porcelain >&2
            exit 1
          fi
      - name: csa를 만든다
        run: |
          mkdir -p dist/out
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-w" -o dist/out/csa ./cmd/csa

      # 소스를 잰 것과 붙이는 것이 같다는 보장은 없다. 붙일 바이너리를 그대로 잰다.
      - name: 붙일 바이너리를 잰다
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary ./dist/out/csa

      # 묶음을 만든다. SBOM을 만들며 buildinfo를 검사하고, 독립 검사를 지나야 tar가 된다.
      - name: 묶음과 SBOM을 만든다
        env:
          PACK_VERSION: ${{ steps.ref.outputs.version }}
          PACK_COMMIT: ${{ github.sha }}
          PACK_REPO: ${{ github.repository }}
          PACK_HOOK: tools/sbom/check-independent.sh
        run: dist/pack.sh dist/out/csa ${{ matrix.arch }} dist/out

      - name: 묶음을 검사한다
        run: |
          go run ./tools/sbom verify -tar "dist/out/csa-linux-${{ matrix.arch }}.tar.gz" \
            -copy "dist/out/csa-linux-${{ matrix.arch }}.spdx.json" \
            -program csa -arch ${{ matrix.arch }} -version "${{ steps.ref.outputs.version }}" \
            -commit "${{ github.sha }}" -repo "$REPO" -license Apache-2.0

      # actions/attest는 predicate를 주지 않으면 SLSA 출처 증명을 만들고, sbom-path를
      # 주면 SBOM 증명을 만든다. attest-build-provenance와 attest-sbom은 이것을
      # 감싼 것이고 새로 만드는 것은 attest를 쓰라고 한다.
      - name: 출처 증명을 만든다
        id: prov
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/out/csa-linux-${{ matrix.arch }}.tar.gz

      - name: SBOM 증명을 만든다
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/out/csa-linux-${{ matrix.arch }}.tar.gz
          sbom-path: dist/out/csa-linux-${{ matrix.arch }}.spdx.json

      - name: 증명 둘을 JSONL로 조립한다
        run: |
          go run ./tools/sbom jsonl -out "dist/out/csa-linux-${{ matrix.arch }}.tar.gz.attestations.jsonl" \
            "${{ steps.prov.outputs.bundle-path }}" "${{ steps.sbom.outputs.bundle-path }}"

      # 만든 쪽이 스스로 확인하지 못한 것을 붙이지 않는다. 설치 문서의 명령 그대로
      # 리포와 워크플로와 참조와 커밋을 모두 강제한다. 이것은 발행 구성의 오류를
      # 막는 관문이지 워크플로 자체의 침해를 막는 것이 아니다.
      # 검증이 실제로 무엇을 보았는지 찍고, 다른 커밋과 다른 참조를 주면 거절하는지도
      # 본다. 지나갔다는 끝 값만으로는 옵션이 강제되는지 알 수 없다.
      - name: 온라인으로 검증한다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="dist/out/csa-linux-${{ matrix.arch }}.tar.gz"
          common=(-R "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml"
                  --source-ref "${{ steps.ref.outputs.ref }}" --source-digest "${{ github.sha }}"
                  --deny-self-hosted-runners)
          gh attestation verify "$f" "${common[@]}" --format json > prov.json
          gh attestation verify "$f" "${common[@]}" --predicate-type https://spdx.dev/Document/v2.3 --format json > sbom.json
          for j in prov.json sbom.json; do
            jq -r '.[] | [.verificationResult.statement.predicateType, .verificationResult.statement.subject[0].name,
                          .verificationResult.signature.certificate.sourceRepositoryRef,
                          .verificationResult.signature.certificate.sourceRepositoryDigest,
                          .verificationResult.signature.certificate.buildSignerURI,
                          .verificationResult.signature.certificate.runnerEnvironment] | join("  ")' "$j"
            [ "$(jq length "$j")" -ge 1 ]
          done
          if gh attestation verify "$f" "${common[@]}" --source-digest 0000000000000000000000000000000000000000 2>/dev/null; then
            echo "다른 커밋을 받아들였습니다" >&2; exit 1
          fi
          if gh attestation verify "$f" -R "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml" \
               --source-ref refs/tags/v0.0.0 --source-digest "${{ github.sha }}" --deny-self-hosted-runners 2>/dev/null; then
            echo "다른 참조를 받아들였습니다" >&2; exit 1
          fi
          rm -f prov.json sbom.json

      - name: 오프라인으로 검증한다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="dist/out/csa-linux-${{ matrix.arch }}.tar.gz"
          gh attestation trusted-root > dist/out/trusted-root.jsonl
          common=(-R "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml"
                  --source-ref "${{ steps.ref.outputs.ref }}" --source-digest "${{ github.sha }}"
                  --deny-self-hosted-runners --bundle "$f.attestations.jsonl"
                  --custom-trusted-root dist/out/trusted-root.jsonl)
          gh attestation verify "$f" "${common[@]}" --format json | jq -r '.[] | .verificationResult.statement.predicateType'
          gh attestation verify "$f" "${common[@]}" --predicate-type https://spdx.dev/Document/v2.3 --format json | jq -r '.[] | .verificationResult.statement.predicateType'
          if gh attestation verify "$f" "${common[@]}" --source-digest 0000000000000000000000000000000000000000 2>/dev/null; then
            echo "오프라인 검증이 다른 커밋을 받아들였습니다" >&2; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.arch }}
          path: |
            dist/out/csa-linux-${{ matrix.arch }}.tar.gz
            dist/out/csa-linux-${{ matrix.arch }}.spdx.json
            dist/out/csa-linux-${{ matrix.arch }}.tar.gz.attestations.jsonl
          if-no-files-found: error

  # 릴리스를 만든다. 예행 실행에서는 마지막 걸음만 빼고 모두 돈다. 다시 검증하는
  # 길도 예행에서 밟혀야 한다.
  #
  # 검증한 바이트와 발행하는 바이트가 같아야 한다. 아티팩트로 오간 파일이 증명의
  # 대상과 같은지를 download-artifact는 경고로만 말하므로, 여기서 고정한 gh로
  # 실제 발행할 파일을 다시 검증한다. 하나라도 실패하면 릴리스를 만들지 않는다.
  publish:
    name: 릴리스를 만든다
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/out
          merge-multiple: true

      - name: gh를 정확한 판으로 설치한다
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gh.tar.gz "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  gh.tar.gz" | sha256sum -c --quiet
          tar -xzf gh.tar.gz
          mkdir -p "$HOME/.local/bin" && mv "gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version

      # 자산의 수가 정확해야 한다. 아키텍처 둘에 묶음과 SBOM 사본과 증명 묶음이 하나씩이다.
      - name: 자산의 수를 본다
        run: |
          cd dist/out
          ls -la
          for pat in '*.tar.gz' '*.spdx.json' '*.attestations.jsonl'; do
            n=$(ls $pat | wc -l)
            if [ "$n" != 2 ]; then echo "$pat 가 둘이 아닙니다: $n" >&2; exit 1; fi
          done

      # 실제 발행할 파일을 설치 문서의 명령 그대로 다시 검증한다. 온라인으로
      # predicate 둘 다, 그리고 함께 붙이는 증명 묶음으로도 본다.
      - name: 발행할 파일을 다시 검증한다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          common=(-R "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml"
                  --source-ref "${{ needs.build.outputs.ref }}" --source-digest "${{ github.sha }}"
                  --deny-self-hosted-runners)
          for f in dist/out/*.tar.gz; do
            gh attestation verify "$f" "${common[@]}" --format json | jq -r --arg f "$f" '.[] | [$f, .verificationResult.statement.predicateType, .verificationResult.signature.certificate.sourceRepositoryRef, .verificationResult.signature.certificate.sourceRepositoryDigest] | join("  ")'
            gh attestation verify "$f" "${common[@]}" --predicate-type https://spdx.dev/Document/v2.3 --format json | jq -r --arg f "$f" '.[] | [$f, .verificationResult.statement.predicateType] | join("  ")'
            gh attestation verify "$f" "${common[@]}" --bundle "$f.attestations.jsonl" >/dev/null
            gh attestation verify "$f" "${common[@]}" --bundle "$f.attestations.jsonl" --predicate-type https://spdx.dev/Document/v2.3 >/dev/null
            go run ./tools/sbom verify -tar "$f" -copy "${f%.tar.gz}.spdx.json" \
              -program csa -arch "$(basename "$f" .tar.gz | sed 's/^csa-linux-//')" \
              -version "${{ needs.build.outputs.version }}" -commit "${{ github.sha }}" -repo "$REPO" -license Apache-2.0
          done

      # 체크섬은 다시 검증한 그 파일에 대해 만든다. 받는 쪽이 실제로 내려받는 것이
      # 묶음이다. 체크섬은 증명을 대신하지 못한다. 같은 자리에서 내려받기 때문이다.
      - name: 체크섬을 만든다
        run: |
          cd dist/out
          sha256sum *.tar.gz > sha256sum.txt
          cat sha256sum.txt

      # 기술 프리뷰인 동안은 pre-release로 표시한다. 본문의 커밋 해시는 편의를
      # 위한 값이다. 본문은 고칠 수 있으므로 독립적인 근거가 아니다.
      - name: 릴리스를 만든다
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          무엇을 만들었는지는 [릴리스 노트](RELEASE_NOTES.md)에 있습니다. 묶음마다 정적으로 링크한 리눅스 바이너리 하나와 서비스 파일과 설치 스크립트와 INSTALL.md와 라이선스 원문과 부품 목록(sbom.spdx.json)이 함께 들어 있습니다. 설치 절차는 [INSTALL.md](INSTALL.md)에 있습니다.

          이 태그는 커밋 \`${{ github.sha }}\`을(를) 가리킵니다. 묶음의 출처 증명과 부품 목록 증명을 이렇게 확인합니다. gh 2.97.0 이상이 필요합니다.

          \`\`\`bash
          gh attestation verify csa-linux-amd64.tar.gz -R $REPO \\
            --signer-workflow $REPO/.github/workflows/release.yml \\
            --source-ref ${{ github.ref }} --source-digest ${{ github.sha }} --deny-self-hosted-runners
          \`\`\`

          부품 목록 증명은 같은 명령에 \`--predicate-type https://spdx.dev/Document/v2.3\`을 붙입니다. 오프라인 검증은 [INSTALL.md](INSTALL.md)의 「받은 묶음을 확인하기」에 있습니다.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --prerelease \
            --notes-file notes.md \
            dist/out/*.tar.gz dist/out/sha256sum.txt dist/out/*.spdx.json dist/out/*.attestations.jsonl \
            LICENSE THIRD-PARTY-NOTICES.md
