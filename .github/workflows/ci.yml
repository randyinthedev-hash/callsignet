# 밀 때마다 단위 시험과 통합 시험을 돌린다.
#
# VM 시험은 여기서 돌리지 않는다. libvirt로 실제 VM을 띄우는데 러너 안에서는
# 중첩 가상화가 되지 않는다. 그것은 사람이 손으로 돌린다.
name: 시험

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 작업의 열쇠는 영문이어야 한다. 화면에 보이는 이름만 한글로 둔다.
  unit:
    name: 단위 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make test

  # 가져다 쓰는 것에 알려진 취약점이 있는지 본다. 판을 고정하는 것은 도구이고,
  # 취약점 목록은 돌 때마다 새로 받아 온다. 그래서 어제 통과한 것이 오늘 걸릴
  # 수 있고, 그것이 이 검사의 요점이다.
  vuln:
    name: 의존성 취약점 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  tunnel:
    name: 통합 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # csa는 nftables로 직통 경로를 닫고, 시험은 dig로 이름 해석을 확인한다.
      - name: 준비물을 설치한다
        run: sudo apt-get update -qq && sudo apt-get install -yqq nftables dnsutils

      # 러너에 도커가 있으면 br_netfilter가 올라와 브리지로 오가는 패킷이
      # iptables의 FORWARD를 지난다. 그 사슬이 기본으로 DROP이면 네임스페이스
      # 둘이 서로 닿지 못한다. 시험이 만드는 브리지에만 걸리는 문제다.
      - name: 브리지로 오가는 패킷을 막지 않게 한다
        run: |
          sudo modprobe br_netfilter || true
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0 || true
          sudo iptables -P FORWARD ACCEPT || true

      - name: 통합 시험을 돌린다
        run: sudo make tunnel
